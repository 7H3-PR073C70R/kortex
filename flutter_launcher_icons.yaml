flutter_launcher_icons:
  android: true
  ios: "AppIcon"
  macos:
    generate: true
    image_path: "assets/icons/app_icon_production.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon_production.png"
    background_color: "#0A0C14"
    theme_color: "#0A0C14"
  windows:
    generate: true
    image_path: "assets/icons/app_icon_production.png"
    icon_size: 48
  image_path: "assets/icons/app_icon_production.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0C14"
  adaptive_icon_foreground: "assets/icons/app_icon_production.png"
  remove_alpha_ios: true
