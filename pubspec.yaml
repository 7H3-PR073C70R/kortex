name: kortex
description: Kortexify is a local-first, AI-augmented academic workspace designed to replace fragmented study tools (Anki, Quizlet, Chegg, and unanchored chat interfaces like ChatGPT). By combining zero-latency offline storage, multimodal STEM OCR, local vector retrieval-augmented generation (RAG), and adaptive spaced repetition, Kortexify transforms unstructured academic materials (syllabi, lecture slides, textbooks, and past papers) into an active-recall mastery system in a single document drop.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  archive: ^4.0.9
  auto_route: ^11.1.0
  bloc: ^9.2.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.6
  dio: ^5.9.0
  equatable: ^2.0.7
  file_picker: ^12.1.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  google_fonts: ^8.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logger: ^2.6.2
  path_provider: ^2.1.6
  pdf: ^3.12.0
  permission_handler: ^13.0.1
  purchases_flutter: ^10.10.1
  retrofit: ^4.7.3
  share_plus: ^13.3.0
  supabase_flutter: ^2.17.2
  top_snackbar_flutter: ^3.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  auto_route_generator: ^10.5.0
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  flutter_gen_runner: ^5.12.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  retrofit_generator: ^10.0.6
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env.development
    - .env.staging
    - .env.production
    - assets/images/
    - assets/icons/
    - assets/svgs/

flutter_gen:
  output: lib/src/gen/
  line_length: 80

  integrations:
    flutter_svg: true

  assets:
    exclude:
      - .env.*
      - .gitkeep
      - config/
    outputs:
      class_name: AppAssets
