<svg width="240" height="180" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ingestGrad" x1="0" y1="0" x2="240" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4F46E5" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="90" r="70" fill="#4F46E5" fill-opacity="0.08"/>

  <!-- Left Input Document Container -->
  <rect x="24" y="36" width="68" height="96" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="36" y="52" width="44" height="6" rx="3" fill="#4F46E5"/>
  <rect x="36" y="66" width="36" height="4" rx="2" fill="#64748B"/>
  <rect x="36" y="76" width="40" height="4" rx="2" fill="#64748B"/>
  <rect x="36" y="86" width="28" height="4" rx="2" fill="#64748B"/>
  <rect x="36" y="104" width="44" height="14" rx="4" fill="#4F46E5" fill-opacity="0.2"/>
  <text x="40" y="115" fill="#818CF8" font-size="8" font-family="monospace" font-weight="bold">PDF.PARSE</text>

  <!-- Central Processing Engine Orb -->
  <circle cx="120" cy="84" r="20" fill="#1E293B" stroke="url(#cardGrad)" stroke-width="2"/>
  <polygon points="120,72 129,78 129,90 120,96 111,90 111,78" stroke="#06B6D4" stroke-width="1.5" fill="none"/>
  <circle cx="120" cy="84" r="4" fill="#8B5CF6"/>

  <!-- Synapse Connectors -->
  <path d="M 92 84 L 100 84" stroke="#4F46E5" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M 140 84 C 150 84, 150 54, 160 54" stroke="#06B6D4" stroke-width="2"/>
  <path d="M 140 84 C 150 84, 150 114, 160 114" stroke="#8B5CF6" stroke-width="2"/>

  <!-- Right Output 1: Active Recall Flashcard -->
  <rect x="160" y="32" width="60" height="44" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="168" y="42" width="28" height="4" rx="2" fill="#06B6D4"/>
  <rect x="168" y="50" width="44" height="3" rx="1.5" fill="#64748B"/>
  <rect x="168" y="56" width="36" height="3" rx="1.5" fill="#64748B"/>
  <circle cx="206" cy="44" r="4" fill="#10B981"/>

  <!-- Right Output 2: LaTeX Mathematical Graph Node -->
  <rect x="160" y="92" width="60" height="44" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="168" y="112" fill="#A78BFA" font-size="9" font-family="serif" font-style="italic">e^(iπ) + 1 = 0</text>
  <rect x="168" y="120" width="30" height="4" rx="2" fill="#8B5CF6" fill-opacity="0.3"/>
</svg>
