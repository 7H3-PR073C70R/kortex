<svg width="360" height="280" viewBox="0 0 360 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0" y1="0" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Aura -->
  <circle cx="180" cy="140" r="110" fill="#6366F1" fill-opacity="0.1" filter="url(#glow1)"/>
  <circle cx="280" cy="90" r="60" fill="#06B6D4" fill-opacity="0.08" filter="url(#glow1)"/>

  <!-- Left: Source Syllabus / Notes Card -->
  <g transform="translate(25, 45)">
    <rect x="0" y="8" width="115" height="155" rx="16" fill="#0F172A" fill-opacity="0.7" stroke="#334155" stroke-width="1.2" transform="rotate(-5 57 80)"/>
    <rect x="12" y="0" width="115" height="155" rx="16" fill="url(#cardGrad1)" stroke="url(#glassBorder)" stroke-width="1.5"/>
    
    <rect x="26" y="22" width="60" height="7" rx="3.5" fill="#818CF8"/>
    <rect x="26" y="37" width="80" height="4" rx="2" fill="#94A3B8"/>
    <rect x="26" y="47" width="75" height="4" rx="2" fill="#94A3B8"/>
    <rect x="26" y="57" width="55" height="4" rx="2" fill="#94A3B8"/>

    <!-- Laser Parser Bar -->
    <rect x="20" y="78" width="98" height="2.5" fill="#38BDF8" filter="url(#glow1)"/>
    <rect x="26" y="98" width="78" height="24" rx="8" fill="url(#laserGrad)"/>
    <text x="34" y="114" fill="#FFFFFF" font-size="9.5" font-family="sans-serif" font-weight="bold" letter-spacing="0.8">PDF.PARSE</text>
  </g>

  <!-- Center: Neural Cortex Core -->
  <g transform="translate(155, 110)">
    <circle cx="25" cy="25" r="26" fill="#4F46E5" fill-opacity="0.25" filter="url(#glow1)"/>
    <polygon points="25,5 44,16 44,34 25,45 6,34 6,16" stroke="#38BDF8" stroke-width="2.2" fill="#0F172A"/>
    <circle cx="25" cy="25" r="7" fill="#6366F1"/>
    <circle cx="25" cy="25" r="2.5" fill="#FFFFFF"/>
    
    <!-- Flow Connectors -->
    <path d="M-18,25 Q-4,12 6,20" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M44,20 Q60,5 78,0" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M44,30 Q60,45 78,55" stroke="#A855F7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right: Generated Active Recall Cards -->
  <g transform="translate(235, 40)">
    <!-- Smart Flashcard -->
    <rect x="0" y="0" width="105" height="72" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="16" cy="18" r="4.5" fill="#10B981"/>
    <rect x="28" y="15" width="55" height="5" rx="2.5" fill="#38BDF8"/>
    <rect x="14" y="32" width="75" height="4" rx="2" fill="#64748B"/>
    <rect x="14" y="42" width="60" height="4" rx="2" fill="#64748B"/>
    <rect x="14" y="52" width="45" height="4" rx="2" fill="#64748B"/>
    
    <!-- Formula Node -->
    <rect x="0" y="86" width="105" height="72" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#A855F7" stroke-width="1.5"/>
    <text x="12" y="112" fill="#F8FAFC" font-size="11" font-family="sans-serif" font-weight="bold">e^(iπ) + 1 = 0</text>
    <rect x="12" y="128" width="54" height="16" rx="5" fill="#8B5CF6" fill-opacity="0.3"/>
    <text x="18" y="140" fill="#C084FC" font-size="8.5" font-family="sans-serif" font-weight="bold">ACTIVE</text>
  </g>
</svg>
