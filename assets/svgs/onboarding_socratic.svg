<svg width="240" height="180" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="90" r="70" fill="#8B5CF6" fill-opacity="0.08"/>

  <!-- Gauge Card Container -->
  <rect x="28" y="24" width="184" height="132" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Semi-Circular Gauge Background Track -->
  <path d="M 60 110 A 50 50 0 0 1 180 110" stroke="#1E293B" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Progress Calibrated Arc (94% Mastery) -->
  <path d="M 60 110 A 50 50 0 0 1 172 80" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Needle / Indicator Hub -->
  <circle cx="120" cy="110" r="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="120" cy="110" r="6" fill="#8B5CF6"/>

  <!-- Center Readiness Score -->
  <text x="120" y="85" text-anchor="middle" fill="#F8FAFC" font-size="18" font-family="sans-serif" font-weight="bold">94%</text>
  <text x="120" y="98" text-anchor="middle" fill="#94A3B8" font-size="8" font-family="sans-serif" letter-spacing="1">CONFIDENCE</text>

  <!-- Socratic AI Dialogue Pill -->
  <rect x="52" y="128" width="136" height="20" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
  <circle cx="64" cy="138" r="4" fill="#8B5CF6"/>
  <text x="74" y="142" fill="#C4B5FD" font-size="8" font-family="sans-serif">"Why does the entropy increase here?"</text>
</svg>
