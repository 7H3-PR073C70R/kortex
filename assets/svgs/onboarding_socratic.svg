<svg width="360" height="280" viewBox="0 0 360 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="socGlass1" x1="0" y1="0" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="socBorder1" x1="0" y1="0" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="gaugeGrad2" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="socAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Backdrop Aura -->
  <circle cx="180" cy="140" r="100" fill="url(#socAura)"/>

  <!-- Left: Socratic Dialogue Glass Cards -->
  <g transform="translate(25, 40)">
    <!-- AI Bubble -->
    <rect x="0" y="0" width="165" height="74" rx="14" fill="url(#socGlass1)" stroke="url(#socBorder1)" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="5.5" fill="#F59E0B"/>
    <text x="32" y="24" fill="#FCD34D" font-size="9.5" font-family="sans-serif" font-weight="bold">SYLLABOT AI</text>
    <text x="14" y="44" fill="#E2E8F0" font-size="10" font-family="sans-serif">Why does the entropy</text>
    <text x="14" y="58" fill="#E2E8F0" font-size="10" font-family="sans-serif">increase at equilibrium?</text>

    <!-- Student Answer Bubble -->
    <rect x="12" y="86" width="165" height="66" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="32" cy="104" r="5" fill="#10B981"/>
    <text x="44" y="108" fill="#A7F3D0" font-size="9.5" font-family="sans-serif" font-weight="bold">STUDENT ANSWER</text>
    <text x="24" y="126" fill="#94A3B8" font-size="9.5" font-family="sans-serif">Microstate multiplicity W</text>
    <text x="24" y="139" fill="#94A3B8" font-size="9.5" font-family="sans-serif">reaches its maximum.</text>
  </g>

  <!-- Right: Mastery Dial Card -->
  <g transform="translate(215, 45)">
    <rect x="0" y="0" width="120" height="155" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Calibration Dial -->
    <circle cx="60" cy="65" r="42" stroke="#1E293B" stroke-width="8" fill="none"/>
    <path d="M 30,95 A 42 42 0 1 1 90,95" stroke="url(#gaugeGrad2)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <text x="42" y="65" fill="#F8FAFC" font-size="18" font-family="sans-serif" font-weight="bold">94%</text>
    <text x="36" y="80" fill="#94A3B8" font-size="8" font-family="sans-serif" font-weight="bold" letter-spacing="1">MASTERY</text>

    <!-- Badge -->
    <rect x="14" y="120" width="92" height="22" rx="6" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="0.8"/>
    <circle cx="24" cy="131" r="3.5" fill="#F59E0B"/>
    <text x="32" y="135" fill="#FEF3C7" font-size="8.5" font-family="sans-serif" font-weight="bold">EXAM-READY</text>
  </g>
</svg>
