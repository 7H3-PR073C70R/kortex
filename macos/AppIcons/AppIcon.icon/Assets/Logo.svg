<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Editorial Brand Linear Gradient: Muted Sage (#788C7E) to Deep STEM Green (#4A6B5D) & Warm Ochre (#D4A373) -->
    <linearGradient id="kortexGrad" x1="82.8" y1="56" x2="429.2" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#788C7E"/>
      <stop offset="35%" stop-color="#5B8C93"/>
      <stop offset="70%" stop-color="#4A6B5D"/>
      <stop offset="100%" stop-color="#D4A373"/>
    </linearGradient>

    <!-- Clean 2D Central Core Gradient -->
    <radialGradient id="coreRadialGrad" cx="256" cy="256" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#788C7E"/>
      <stop offset="60%" stop-color="#5B8C93"/>
      <stop offset="100%" stop-color="#4A6B5D"/>
    </radialGradient>

    <!-- 1px Isometric Guideline Gradient (Subtle 12% opacity) -->
    <linearGradient id="gridGrad" x1="82.8" y1="56" x2="429.2" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#788C7E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D4A373" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <!-- 1. Crisp 1px Isometric Wireframe Guidelines -->
  <g stroke="url(#gridGrad)" stroke-width="1.2" stroke-linecap="round">
    <!-- Radial Axes (Center to 6 Outer Vertices) -->
    <line x1="256" y1="256" x2="256" y2="56"/>
    <line x1="256" y1="256" x2="429.2" y2="156"/>
    <line x1="256" y1="256" x2="429.2" y2="356"/>
    <line x1="256" y1="256" x2="256" y2="456"/>
    <line x1="256" y1="256" x2="82.8" y2="356"/>
    <line x1="256" y1="256" x2="82.8" y2="156"/>

    <!-- Concentric Inner Hexagon Mesh (Radius = 100) -->
    <polygon points="256,156 342.6,206 342.6,306 256,356 169.4,306 169.4,206" fill="none"/>

    <!-- Cross-Isometric Guideline Chords -->
    <line x1="82.8" y1="156" x2="429.2" y2="156"/>
    <line x1="82.8" y1="356" x2="429.2" y2="356"/>
    <line x1="169.4" y1="206" x2="169.4" y2="306"/>
    <line x1="342.6" y1="206" x2="342.6" y2="306"/>
  </g>

  <!-- 2. Symmetrical Outer Hexagon Shield Frame -->
  <polygon 
    points="256,56 429.2,156 429.2,356 256,456 82.8,356 82.8,156" 
    stroke="url(#kortexGrad)" 
    stroke-width="14" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    fill="none"
  />

  <!-- 3. Stylized Neural "K" Network Mark -->
  <g stroke="url(#kortexGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- "K" Vertical Left Stem -->
    <line x1="156" y1="140" x2="156" y2="372"/>

    <!-- "K" Horizontal Connector to Nucleus -->
    <line x1="156" y1="256" x2="256" y2="256"/>

    <!-- "K" Upper Diagonal Arm -->
    <line x1="256" y1="256" x2="356" y2="140"/>

    <!-- "K" Lower Diagonal Arm -->
    <line x1="256" y1="256" x2="356" y2="372"/>
  </g>

  <!-- 4. Standardized Uniform Outer Hexagon Nodes -->
  <circle cx="256" cy="56" r="10" fill="#788C7E"/>
  <circle cx="429.2" cy="156" r="10" fill="#5B8C93"/>
  <circle cx="429.2" cy="356" r="10" fill="#4A6B5D"/>
  <circle cx="256" cy="456" r="10" fill="#D4A373"/>
  <circle cx="82.8" cy="356" r="10" fill="#4A6B5D"/>
  <circle cx="82.8" cy="156" r="10" fill="#788C7E"/>

  <!-- 5. Standardized Uniform "K" Terminal Nodes -->
  <circle cx="156" cy="140" r="13" fill="#788C7E"/>
  <circle cx="156" cy="372" r="13" fill="#4A6B5D"/>
  <circle cx="356" cy="140" r="13" fill="#5B8C93"/>
  <circle cx="356" cy="372" r="13" fill="#D4A373"/>

  <!-- 6. Refined 2D Vector Central Core -->
  <circle cx="256" cy="256" r="42" stroke="url(#kortexGrad)" stroke-width="2" fill="none" opacity="0.35"/>
  <circle cx="256" cy="256" r="30" fill="url(#coreRadialGrad)"/>
</svg>
