  <style id="splash-screen-style">
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #090D16;
    }

    .splash-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Ambient Glow Pulse */
    .logo-glow {
      transform-origin: 256px 256px;
      animation: glowPulse 2.8s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      0% { opacity: 0.10; transform: scale(0.85); }
      100% { opacity: 0.35; transform: scale(1.15); }
    }

    /* Outer Shield Path Tracing */
    .logo-shield {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: traceShield 2.4s cubic-bezier(0.23, 1, 0.32, 1) forwards infinite alternate;
    }

    @keyframes traceShield {
      0% { stroke-dashoffset: 1200; opacity: 0.2; }
      50%, 80% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.85; }
    }

    /* Neural K Stem & Arms Assembly Motion */
    .k-stem {
      transform-origin: 156px 256px;
      animation: assembleStem 2.4s cubic-bezier(0.23, 1, 0.32, 1) forwards infinite alternate;
    }

    @keyframes assembleStem {
      0% { transform: translateX(-40px); opacity: 0; }
      40%, 100% { transform: translateX(0); opacity: 1; }
    }

    .k-arm-top {
      transform-origin: 256px 256px;
      animation: assembleArmTop 2.4s cubic-bezier(0.23, 1, 0.32, 1) forwards infinite alternate;
    }

    @keyframes assembleArmTop {
      0% { transform: translate(30px, -30px); opacity: 0; }
      50%, 100% { transform: translate(0, 0); opacity: 1; }
    }

    .k-arm-bottom {
      transform-origin: 256px 256px;
      animation: assembleArmBottom 2.4s cubic-bezier(0.23, 1, 0.32, 1) forwards infinite alternate;
    }

    @keyframes assembleArmBottom {
      0% { transform: translate(30px, 30px); opacity: 0; }
      50%, 100% { transform: translate(0, 0); opacity: 1; }
    }

    /* Nodes Spring Scale */
    .logo-outer-nodes, .logo-k-nodes {
      transform-origin: 256px 256px;
      animation: popNodes 2.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards infinite alternate;
    }

    @keyframes popNodes {
      0%, 45% { transform: scale(0); opacity: 0; }
      65%, 100% { transform: scale(1); opacity: 1; }
    }

    /* Wireframe Grid Line Fade & Scaling */
    .logo-grid {
      transform-origin: 256px 256px;
      animation: gridFade 2.4s ease-out forwards infinite alternate;
    }

    @keyframes gridFade {
      0% { opacity: 0; transform: scale(0.85); }
      35%, 100% { opacity: 1; transform: scale(1); }
    }

    /* Core Nucleus Breathing */
    .logo-core {
      transform-origin: 256px 256px;
      animation: coreBreath 2.4s ease-in-out forwards infinite alternate;
    }

    @keyframes coreBreath {
      0% { transform: scale(0.5); opacity: 0.3; }
      30%, 80% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    @media (prefers-color-scheme: light) {
      body {
        background-color: #F8FAFC;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>

<body>
  <div id="splash" class="splash-container">
    <svg width="160" height="160" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" class="kortex-logo-svg">
      <defs>
        <linearGradient id="kortexGrad" x1="82.8" y1="56" x2="429.2" y2="456" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#788C7E"/>
          <stop offset="35%" stop-color="#5B8C93"/>
          <stop offset="70%" stop-color="#4A6B5D"/>
          <stop offset="100%" stop-color="#D4A373"/>
        </linearGradient>

        <radialGradient id="coreRadialGrad" cx="256" cy="256" r="34" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#788C7E"/>
          <stop offset="60%" stop-color="#5B8C93"/>
          <stop offset="100%" stop-color="#4A6B5D"/>
        </radialGradient>

        <linearGradient id="gridGrad" x1="82.8" y1="56" x2="429.2" y2="456" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#788C7E" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#D4A373" stop-opacity="0.16"/>
        </linearGradient>
      </defs>

      <!-- Ambient Glow Backdrop -->
      <circle class="logo-glow" cx="256" cy="256" r="220" fill="url(#coreRadialGrad)" opacity="0.18"/>

      <!-- 1. Wireframe Guidelines -->
      <g class="logo-grid" stroke="url(#gridGrad)" stroke-width="1.2" stroke-linecap="round">
        <line x1="256" y1="256" x2="256" y2="56"/>
        <line x1="256" y1="256" x2="429.2" y2="156"/>
        <line x1="256" y1="256" x2="429.2" y2="356"/>
        <line x1="256" y1="256" x2="256" y2="456"/>
        <line x1="256" y1="256" x2="82.8" y2="356"/>
        <line x1="256" y1="256" x2="82.8" y2="156"/>
        <polygon points="256,156 342.6,206 342.6,306 256,356 169.4,306 169.4,206" fill="none"/>
        <line x1="82.8" y1="156" x2="429.2" y2="156"/>
        <line x1="82.8" y1="356" x2="429.2" y2="356"/>
        <line x1="169.4" y1="206" x2="169.4" y2="306"/>
        <line x1="342.6" y1="206" x2="342.6" y2="306"/>
      </g>

      <!-- 2. Outer Hexagon Shield Frame -->
      <polygon class="logo-shield"
        points="256,56 429.2,156 429.2,356 256,456 82.8,356 82.8,156" 
        stroke="url(#kortexGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"
      />

      <!-- 3. Neural K Network Mark -->
      <g stroke="url(#kortexGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
        <line class="k-stem" x1="156" y1="140" x2="156" y2="372"/>
        <line class="k-connector" x1="156" y1="256" x2="256" y2="256"/>
        <line class="k-arm-top" x1="256" y1="256" x2="356" y2="140"/>
        <line class="k-arm-bottom" x1="256" y1="256" x2="356" y2="372"/>
      </g>

      <!-- 4. Outer Hexagon Nodes -->
      <g class="logo-outer-nodes">
        <circle cx="256" cy="56" r="10" fill="#788C7E"/>
        <circle cx="429.2" cy="156" r="10" fill="#5B8C93"/>
        <circle cx="429.2" cy="356" r="10" fill="#4A6B5D"/>
        <circle cx="256" cy="456" r="10" fill="#D4A373"/>
        <circle cx="82.8" cy="356" r="10" fill="#4A6B5D"/>
        <circle cx="82.8" cy="156" r="10" fill="#788C7E"/>
      </g>

      <!-- 5. K Terminal Nodes -->
      <g class="logo-k-nodes">
        <circle cx="156" cy="140" r="13" fill="#788C7E"/>
        <circle cx="156" cy="372" r="13" fill="#4A6B5D"/>
        <circle cx="356" cy="140" r="13" fill="#5B8C93"/>
        <circle cx="356" cy="372" r="13" fill="#D4A373"/>
      </g>

      <!-- 6. Central Core -->
      <g class="logo-core">
        <circle cx="256" cy="256" r="42" stroke="url(#kortexGrad)" stroke-width="2" fill="none" opacity="0.35"/>
        <circle cx="256" cy="256" r="30" fill="url(#coreRadialGrad)"/>
      </g>
    </svg>
  </div>

  <script>
    (function () {
      function removeSplash() {
        if (typeof removeSplashFromWeb === 'function') {
          removeSplashFromWeb();
        }
      }

      window.addEventListener('flutter-first-frame', removeSplash);

      const observer = new MutationObserver(function (mutations, obs) {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host')) {
          removeSplash();
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      setTimeout(function() {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host')) {
          removeSplash();
        }
      }, 5000);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
