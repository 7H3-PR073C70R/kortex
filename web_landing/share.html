<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Shared Content | Kortexify</title>
  
  <meta property="og:type" content="website">
  <meta property="og:title" id="og-title" content="Shared Academic Content on Kortexify">
  <meta property="og:description" id="og-desc" content="Open this link in Kortexify to access flashcards, forum discussions, quiz duels, or study rooms.">
  <meta property="og:image" content="assets/images/social_og.jpg">

  <link rel="icon" type="image/svg+xml" href="assets/kortexify_logo.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0d14;
      --card-bg: rgba(22, 27, 44, 0.75);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
    }
    .container {
      width: 90%;
      max-width: 480px;
      padding: 32px 24px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 100px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .logo {
      width: 56px;
      height: 56px;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 12px 0;
      color: #ffffff;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      margin: 0 0 28px 0;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      margin-bottom: 12px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      box-sizing: border-box;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .footer-note {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/kortexify_logo.svg" alt="Kortexify Logo" class="logo">
    <div class="badge" id="type-badge">Kortex Link</div>
    <h1 id="title">Shared Academic Item</h1>
    <p id="description">Open this shared link in Kortexify workspace or download the app to join.</p>

    <a id="open-app-btn" href="#" class="btn btn-primary">Open in Kortexify App</a>
    <a href="https://kortex-study-app-2026.web.app/" class="btn btn-secondary">Visit Web Landing</a>

    <div class="footer-note">
      Kortexify AI-Augmented Academic Workspace
    </div>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const type = urlParams.get('type') || 'content';
      const id = urlParams.get('id') || urlParams.get('code') || '';
      const title = urlParams.get('title') || 'Shared Item';
      const desc = urlParams.get('desc') || urlParams.get('description') || 'Open this link in Kortexify to view shared content.';

      // Format badges
      const badgeElem = document.getElementById('type-badge');
      badgeElem.innerText = type.replace('_', ' ').toUpperCase();

      document.getElementById('title').innerText = title;
      document.getElementById('description').innerText = desc;
      document.getElementById('page-title').innerText = title + ' | Kortexify';

      // Build custom app scheme: kortex://share?type=...&id=...
      const appSchemeUrl = 'kortex://share' + window.location.search;
      const openBtn = document.getElementById('open-app-btn');
      openBtn.href = appSchemeUrl;

      // Auto-attempt redirect on mobile devices
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile && id) {
        setTimeout(function() {
          window.location.href = appSchemeUrl;
        }, 300);
      }
    })();
  </script>
</body>
</html>
