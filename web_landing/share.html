<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="page-title">Shared Content | Kortexify</title>
<meta name="description" content="Open this shared study deck, room, or CBT exam in the Kortexify app.">

<meta property="og:type" content="website">
<meta property="og:title" id="og-title" content="Shared Academic Content on Kortexify">
<meta property="og:description" id="og-desc" content="Open this link in Kortexify to access flashcards, forum discussions, quiz duels, or study rooms.">
<meta property="og:image" content="https://kortex-study-app-2026.web.app/assets/images/social_og.jpg">

<!-- Favicon -->
<link rel="icon" href="assets/kortexify_logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.ico">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600&display=swap">

<!-- Design System CSS -->
<link rel="stylesheet" href="css/kx.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.share-card{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-xl);padding:36px 28px;text-align:center;box-shadow:0 30px 80px -25px rgba(0,0,0,.5)}
.share-badge{display:inline-block;padding:4px 14px;border-radius:var(--radius-full);background:color-mix(in srgb,var(--sage) 18%,transparent);border:1px solid color-mix(in srgb,var(--sage) 35%,transparent);color:var(--sage);font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:16px 0 12px}
.share-card h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;margin-bottom:10px;color:var(--ink)}
.share-card p{font-size:.9rem;color:var(--mute);line-height:1.55;margin-bottom:24px}
.share-actions{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
  <div class="share-card">
    <svg width="48" height="48" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="margin:0 auto">
      <defs>
        <linearGradient id="kortexGrad" x1="82.8" y1="56" x2="429.2" y2="456" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#788C7E"/>
          <stop offset="35%" stop-color="#5B8C93"/>
          <stop offset="70%" stop-color="#4A6B5D"/>
          <stop offset="100%" stop-color="#D4A373"/>
        </linearGradient>
        <radialGradient id="coreRadialGrad" cx="256" cy="256" r="34" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#788C7E"/>
          <stop offset="60%" stop-color="#5B8C93"/>
          <stop offset="100%" stop-color="#4A6B5D"/>
        </radialGradient>
      </defs>
      <rect x="36" y="36" width="440" height="440" rx="96" fill="#141417" stroke="rgba(120,140,126,0.25)" stroke-width="2.5"/>
      <path d="M156 140V372" stroke="url(#kortexGrad)" stroke-width="44" stroke-linecap="round"/>
      <path d="M356 140L256 256L356 372" stroke="url(#kortexGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="156" cy="140" r="13" fill="#788C7E"/>
      <circle cx="156" cy="372" r="13" fill="#4A6B5D"/>
      <circle cx="356" cy="140" r="13" fill="#5B8C93"/>
      <circle cx="356" cy="372" r="13" fill="#D4A373"/>
      <circle cx="256" cy="256" r="30" fill="url(#coreRadialGrad)"/>
    </svg>

    <div class="share-badge" id="type-badge">Kortex Link</div>
    <h1 id="title">Shared Academic Item</h1>
    <p id="description">Open this shared deck, question set, or study room in your Kortexify workspace.</p>

    <div class="share-actions">
      <a id="open-app-btn" href="/workspace/login" class="btn p" style="width:100%" data-mag>Open in Kortexify</a>
      <a href="index.html" class="btn" style="width:100%">Visit Website Home</a>
    </div>

    <div style="font-size:.75rem;color:var(--mute);margin-top:20px;font-family:'JetBrains Mono',monospace">
      Kortexify · Cognitive Active Recall
    </div>
  </div>

  <script src="js/kx.js"></script>
  <script>
  (function() {
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type') || 'content';
    const id = urlParams.get('id') || urlParams.get('code') || '';
    const title = urlParams.get('title') || 'Shared Study Item';
    const desc = urlParams.get('desc') || urlParams.get('description') || 'Open this link in Kortexify to view shared study materials.';

    const badgeElem = document.getElementById('type-badge');
    badgeElem.textContent = type.replace('_', ' ').toUpperCase();

    document.getElementById('title').textContent = title;
    document.getElementById('description').textContent = desc;
    document.getElementById('page-title').textContent = title + ' | Kortexify';

    const appSchemeUrl = 'kortex://share' + window.location.search;
    const openBtn = document.getElementById('open-app-btn');
    openBtn.href = appSchemeUrl;

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isMobile && id) {
      setTimeout(() => {
        window.location.href = appSchemeUrl;
      }, 350);
    }
  })();
  </script>
</body>
</html>
