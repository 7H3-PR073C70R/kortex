<svg width="360" height="280" viewBox="0 0 360 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="retGlass" x1="0" y1="0" x2="300" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06281E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#061A14" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="retBorder" x1="0" y1="0" x2="300" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="curveFill2" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Aura -->
  <circle cx="180" cy="140" r="100" fill="#10B981" fill-opacity="0.08" filter="url(#glow3)"/>

  <!-- Analytics Board Container -->
  <g transform="translate(30, 35)">
    <rect x="0" y="0" width="300" height="210" rx="20" fill="url(#retGlass)" stroke="url(#retBorder)" stroke-width="1.6"/>
    
    <!-- Grid Guide Lines -->
    <line x1="20" y1="45" x2="280" y2="45" stroke="#064E3B" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="20" y1="90" x2="280" y2="90" stroke="#064E3B" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="20" y1="135" x2="280" y2="135" stroke="#064E3B" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- Forgetting Decay Area Fill -->
    <path d="M 25,40 Q 85,140 150,140 L 150,165 L 25,165 Z" fill="url(#curveFill2)"/>
    <!-- SM-2 Reinforcement Boost Area Fill -->
    <path d="M 150,55 Q 210,85 275,65 L 275,165 L 150,165 Z" fill="url(#curveFill2)"/>

    <!-- Curves -->
    <path d="M 25,40 Q 85,140 150,140" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 3"/>
    <path d="M 150,55 Q 210,85 275,65" stroke="#10B981" stroke-width="3" stroke-linecap="round" filter="url(#glow3)"/>

    <!-- Milestone Nodes -->
    <g transform="translate(150, 55)">
      <circle cx="0" cy="0" r="7" fill="#10B981" filter="url(#glow3)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
      <rect x="-24" y="-30" width="48" height="20" rx="7" fill="#065F46" stroke="#10B981" stroke-width="0.8"/>
      <text x="-16" y="-16" fill="#A7F3D0" font-size="9" font-family="sans-serif" font-weight="bold">DAY 3</text>
    </g>

    <g transform="translate(275, 65)">
      <circle cx="0" cy="0" r="7" fill="#10B981" filter="url(#glow3)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
      <rect x="-26" y="-30" width="52" height="20" rx="7" fill="#065F46" stroke="#10B981" stroke-width="0.8"/>
      <text x="-18" y="-16" fill="#A7F3D0" font-size="9" font-family="sans-serif" font-weight="bold">DAY 14</text>
    </g>

    <!-- Formula Tag -->
    <rect x="25" y="165" width="95" height="26" rx="8" fill="#022C22" stroke="#047857" stroke-width="1"/>
    <text x="34" y="182" fill="#34D399" font-size="10" font-family="serif" font-weight="bold">R = e^(-t/S)</text>

    <!-- Recall Badge -->
    <rect x="185" y="165" width="90" height="26" rx="8" fill="#047857" fill-opacity="0.35" stroke="#10B981" stroke-width="0.8"/>
    <text x="195" y="182" fill="#ECFDF5" font-size="9.5" font-family="sans-serif" font-weight="bold">+92% RECALL</text>
  </g>
</svg>
