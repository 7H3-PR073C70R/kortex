name: Build & Publish Android Release

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
      - created
  workflow_dispatch:

jobs:
  build-and-publish-android:
    name: Build & Publish Android APK to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create and populate ENVs
        shell: bash
        run: |
          for env in development staging production; do
            echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env.$env
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env.$env
            echo "LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}" >> .env.$env
            echo "R2_PUBLIC_DOMAIN=${{ secrets.R2_PUBLIC_DOMAIN }}" >> .env.$env
          done

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Install FlutterFire CLI
        run: |
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Generate Code via build_runner
        run: dart run build_runner build -d

      - name: Decrypt and set up Android Keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Set up Gradle properties
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Build Production Android APK
        run: |
          flutter build apk --release --flavor production -t lib/main_production.dart

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-production-apk
          path: build/app/outputs/flutter-apk/app-production-release.apk

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KORTEX_STUDY_APP_2026 }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-production-release.apk
          releaseNotes: "Production Android Release ${{ github.ref_name || github.sha }}"
